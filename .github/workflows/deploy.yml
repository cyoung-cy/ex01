name: Deploy Fullstack App to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

            # 1. 프론트엔드 빌드 (VITE_API_URL 주입)
      - name: Build Frontend
        working-directory: ./board-app
        run: |
          npm install
          # Nginx 프록시를 사용하므로 상대 경로 /api/boards를 사용하거나 EC2 IP를 입력합니다.
          VITE_API_URL=/api/boards npm run build

      # 2. EC2로 파일 전송 (생략 - 기존과 동일)
      
      # 3. 서버에서 환경 변수 설정 및 실행
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_TARGET_DIR }}/board-backend
            
            # .env 파일 생성 (DB 정보)
            echo "DB_HOST=localhost" > .env
            echo "DB_PORT=3306" >> .env
            echo "DB_USER=root" >> .env
            echo "DB_PASSWORD=1234" >> .env
            echo "DB_NAME=myDb" >> .env
            echo "PORT=5000" >> .env
            
            npm install
            pm2 delete board-api || true
            pm2 start src/server.js --name board-api
