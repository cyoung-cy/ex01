name: Deploy React App to EC2

on:
  push:
    branches:
      - main # 혹은 배포하고자 하는 브랜치명으로 수정하세요.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './board-app/package-lock.json'

      - name: Install dependencies
        working-directory: ./board-app
        run: npm install

      - name: Build project
        working-directory: ./board-app
        run: npm run build

      - name: Deploy to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "board-app/dist/*"
          target: ${{ secrets.EC2_TARGET_DIR }}
          strip_components: 2 # board-app/dist/ 경로를 제거하고 파일만 전송
