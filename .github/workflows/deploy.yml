name: Deploy Fullstack App to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 프론트엔드 빌드
      - name: Build Frontend
        working-directory: ./board-app
        run: |
          npm install
          npm run build

      # 2. EC2로 파일 전송 (프론트엔드 dist + 백엔드 소스)
      - name: Deploy to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "board-app/dist/*,board-backend/*"
          target: ${{ secrets.EC2_TARGET_DIR }}

      # 3. 서버에서 의존성 설치 및 백엔드 실행
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_TARGET_DIR }}/board-backend
            npm install
            # PM2로 서버 시작/재시작
            pm2 delete board-api || true
            pm2 start src/server.js --name board-api
